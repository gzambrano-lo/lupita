    <script>
        (function () {
            const pageAudio = document.getElementById("pageAudio");
            const audioToggleBtn = document.getElementById("audioToggleBtn");

            if (!pageAudio || !audioToggleBtn) return;

            function syncAudioUi() {
                const playing = !pageAudio.paused;
                const audioButtonText = audioToggleBtn.querySelector(".sr-only");
                if (audioButtonText) audioButtonText.textContent = playing ? "pause audio" : "play audio";
                audioToggleBtn.setAttribute("aria-pressed", playing ? "true" : "false");
                audioToggleBtn.setAttribute("aria-label", playing ? "Pause page audio" : "Play page audio");
            }

            audioToggleBtn.addEventListener("click", function () {
                if (pageAudio.paused) {
                    pageAudio.play().catch(function (error) {
                        console.error(error);
                    });
                } else {
                    pageAudio.pause();
                }
            });

            function startAudioFromInteraction(event) {
                if (event.target && event.target.closest("#audioToggleBtn")) return;
                pageAudio.play().catch(function (error) {
                    console.error(error);
                });
            }

            ["pointerdown", "keydown", "touchstart"].forEach(function (eventName) {
                document.addEventListener(eventName, startAudioFromInteraction, { once: true });
            });

            ["play", "pause", "ended"].forEach(function (eventName) {
                pageAudio.addEventListener(eventName, syncAudioUi);
            });
            syncAudioUi();
        })();
    </script>
