<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>music - lupe zambrano</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Mono:ital,wght@0,300..700;1,300..700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../styles/reset.css">
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/layout.css">
  <link rel="stylesheet" href="../styles/components.css">
  <link rel="stylesheet" href="../styles/minimal.css">
</head>

<body>
  <main class="scrapbook">
    <div class="site-card music-site-card">
      <header class="site-header">
        <nav id="nav_menu" aria-label="Main" class="hero-tabs tab-nav">
          <ul class="tab-nav-list">
            <li class="tab-nav-item"><a class="tab-nav-link" href="/index.html">home</a></li>
            <li class="tab-nav-item"><a class="tab-nav-link" href="/pages/about.html">about</a></li>
            <li class="tab-nav-item"><a class="tab-nav-link" href="/pages/music.html" aria-current="page">music</a></li>
            <li class="tab-nav-item"><a class="tab-nav-link" href="/pages/links.html">links</a></li>
          </ul>
        </nav>
      </header>

      <section class="music-minimal-page" aria-label="music">
        <div class="minimal-track-list" data-minimal-track-list></div>
        <div class="minimal-player-bar">
          <div class="minimal-player-controls" aria-label="Music controls">
            <button class="minimal-player-button" type="button" data-minimal-previous aria-label="Previous song">
              <img src="../assets/svg/noun_rewind_4627099_@1200.svg" alt="">
            </button>
            <button class="minimal-player-button minimal-player-button-main" type="button" data-minimal-play aria-label="Play song" aria-pressed="false">
              <img src="../assets/svg/noun_playpause_4627102_@1200.svg" alt="">
            </button>
            <button class="minimal-player-button" type="button" data-minimal-next aria-label="Next song">
              <img src="../assets/svg/noun_fastforward_4627100_@1200.svg" alt="">
            </button>
          </div>
          <p class="minimal-now-playing" data-minimal-now-playing>now playing: pick a song</p>
        </div>
        <audio data-minimal-audio preload="metadata"></audio>
      </section>

      <footer class="site-footer">
        <p>&copy; lupita zambrano &#9734;(&gt;&#7447;&bull;) 2025</p>
      </footer>
    </div>
  </main>

  <script src="../scripts/pages/music-playlist.js" defer></script>
  <script src="../scripts/pages/music-list.js" defer></script>
</body>

</html>
